[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-gdn-flashinfer"
version = "0.1.0"
description = "Standalone PyTorch reference for FlashInfer SM120 context-parallel GDN"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["torch_gdn*"]
